name: Build Isai APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Accept Android licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Check backend is present
        run: test -f app/src/main/python/backend.py || (echo "backend.py missing in app/src/main/python" && exit 1)
      - name: Refresh offline copy from the live site
        run: |
          if curl -fsSL --max-time 30 https://isai.thirai.uk/ -o /tmp/site.html && grep -q "isai-shim-v2" /tmp/site.html; then
            cp /tmp/site.html app/src/main/assets/index.html && echo "bundled the live site"
          else
            echo "live site lacks the v2 shim - keeping the committed copy"
          fi
      - name: Icons
        run: sudo apt-get install -y imagemagick >/dev/null && bash tools/make_icons.sh
      - name: Build
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: Isai-apk
          path: app/build/outputs/apk/debug/Isai-debug.apk

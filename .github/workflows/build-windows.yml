name: Build Isai for Windows
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Check backend is present
        run: test -f app/src/main/python/backend.py || (echo "backend.py missing in app/src/main/python" && exit 1)
      - name: Install dependencies
        run: python -m pip install -r windows/requirements.txt
      - name: Refresh offline copy from the live site
        run: |
          if curl -fsSL --max-time 30 https://isai.thirai.uk/ -o site.html && grep -q "isai-shim-v2" site.html && grep -q "isai-serverlogs-v1" site.html; then
            cp site.html app/src/main/assets/index.html && echo "bundled the live site"
          else
            echo "live site lacks the v2 shim or the server-logs screen - keeping the committed copy"
          fi
      - name: Icon
        run: python windows/make_icon.py
      - name: Get ffmpeg
        run: |
          curl -fsSL -o ff.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
          7z x ff.zip -ofdl -y > /dev/null
          mkdir -p windows/ffmpeg
          cp fdl/*/bin/ffmpeg.exe fdl/*/bin/ffprobe.exe windows/ffmpeg/
          ls -l windows/ffmpeg
      - name: Build
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name Isai \
            --icon windows/isai.ico \
            --paths app/src/main/python \
            --hidden-import backend --hidden-import isai_launcher \
            --collect-all yt_dlp --collect-all ytmusicapi --collect-submodules uvicorn \
            --hidden-import webview.platforms.edgechromium \
            --add-data "app/src/main/assets;assets" \
            --add-data "windows/ffmpeg;ffmpeg" \
            windows/isai_desktop.py
      - name: Zip
        run: 7z a Isai-windows.zip ./dist/Isai > /dev/null
      - name: Get WebView2 bootstrapper
        shell: pwsh
        run: Invoke-WebRequest "https://go.microsoft.com/fwlink/p/?LinkId=2124703" -OutFile MicrosoftEdgeWebview2Setup.exe
      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 5.0.2
          wix extension add -g WixToolset.UI.wixext/5.0.2
      - name: Installer art
        run: python windows/make_installer_art.py
      - name: Build MSI
        shell: pwsh
        run: |
          $ws = $env:GITHUB_WORKSPACE
          wix build -arch x64 -ext WixToolset.UI.wixext `
            -d "DistDir=$ws\dist\Isai" `
            -d "IconFile=$ws\windows\isai.ico" `
            -d "DialogBmp=$ws\windows\installer\dialog.bmp" `
            -d "BannerBmp=$ws\windows\installer\banner.bmp" `
            -d "Wv2Setup=$ws\MicrosoftEdgeWebview2Setup.exe" `
            -o "$ws\Isai-Setup.msi" `
            "$ws\windows\installer\Isai.wxs"
      - uses: actions/upload-artifact@v4
        with:
          name: Isai-windows
          path: Isai-windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: Isai-installer
          path: Isai-Setup.msi

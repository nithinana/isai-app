plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}
base { archivesName = "Isai" }
android {
    namespace 'uk.thirai.isai'
    compileSdk 34
    defaultConfig {
        applicationId "uk.thirai.isai"
        minSdk 24
        targetSdk 34
        versionCode 10
        versionName "2.8"
        ndk { abiFilters "arm64-v8a" }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
chaquopy {
    defaultConfig {
        version = "3.12"
        pip {
            install "yt-dlp"
            install "ytmusicapi"
            install "fastapi==0.99.1"
            install "pydantic>=1.10.17,<2"
            install "uvicorn==0.30.6"
            install "Pillow"
        }
    }
}
dependencies { implementation 'androidx.webkit:webkit:1.11.0' }
